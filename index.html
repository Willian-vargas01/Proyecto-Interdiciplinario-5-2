<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Avícola Integral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo-avicola.png" alt="Logo Avícola" class="logo" onerror="this.style.display='none'">
            <h1>AvícolaTech</h1>
        </div>
        <nav>
            <button id="btn-logout" class="hidden">Cerrar Sesión</button>
        </nav>
    </header>

    <main id="main-content">
        <section id="login-section" class="card">
            <h2>Acceso al Sistema</h2>
            <p>Ingrese sus credenciales para continuar</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <select id="role-simulator">
                    <option value="dueno">Dueño / Gerencia</option>
                    <option value="admin">Administrador de Zona</option>
                    <option value="empleado">Empleado Operativo</option>
                    <option value="cliente">Cliente / Comprador</option>
                </select>
                <button type="submit" class="primary-btn">Ingresar</button>
            </form>
        </section>

        <section id="dashboard-section" class="hidden">
            <h2 id="welcome-message"></h2>
            <div id="dashboard-widgets" class="grid-container">
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
